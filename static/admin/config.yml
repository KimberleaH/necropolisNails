backend:
  name: github
  repo: KimberleaH/necropolisNails
  branch: main # Branch to update (optional; defaults to master)
  site_domain: https://necropolisnails.pages.dev/
  base_url: https://necropolisnails.pages.dev/
  auth_endpoint: /auth # This points to /functions/auth.js

media_folder: "/static/images" # Folder where user uploaded files should go
public_folder: "/images"


# The below needs to be updated...

singletons:
  - name: 'home'
    label: 'Home'
    file: 'content/index.md'
    media_folder: /static/images/uploads
    public_folder: /images/uploads
    delete: false
    editor:
      preview: true
    fields:
      - name: 'title'
        label: 'Title'
      - name: 'description'
        label: 'Description'

      ############# NAV LINKS #############
      - label: 'Nav Links'
        name: 'navlinks'
        widget: 'list'
        delete: true
        fields:
        - name: 'text'
          label: 'Text'
        - name: 'url'
          label: 'URL'

      ############# BOOKING BUTTON #############
      - label: "Booking Button"
        name: "bookButton"
        widget: "object"
        summary: 'Booking Button'
        fields:
        - { label: 'Text', name: 'text', widget: 'string' }
        - { label: 'URL', name: 'url', widget: 'string' }

      ############# HERO SECTION #############
      - label: "Header Content"
        name: "header"
        widget: "object"
        fields:
        - { label: 'Heading', name: 'heading', widget: 'string' }
        - { label: 'Blurb', name: 'blurb', widget: 'richtext' }
        - { label: 'Image', name: 'image', widget: 'image' }
        - label: "Secondary Button"
          name: "secondButton"
          widget: "object"
          fields:
          - { label: 'Text', name: 'text', widget: 'string' }
          - { label: 'URL', name: 'url', widget: 'string' }

      ############# CONTACT SECTION #############

      - label: "Contact Section"
        name: "contact"
        widget: "object"
        summary: 'Contact Section'
        fields:
        - { label: 'Address', name: 'address', widget: 'string' }
        - { label: 'GMB URL', name: 'addressURL', widget: 'string' }
        - { label: 'Phone', name: 'phone', widget: 'string' }
        - { label: 'Email', name: 'email', widget: 'string' }
        - { label: 'Instagram', name: 'instagram', widget: 'string', hint: 'This appears below the gallery.' }
        
        
      ############# HOURS #############
      - label: 'Business Hours' 
        name: 'businessHours'
        widget: 'list'
        hint: 'Use <br> to create a gap.'
        delete: true
        fields:
        - { label: 'Days', name: 'day', widget: 'string' }
        - { label: 'Hours', name: 'hours', widget: 'string' }
        
      ############# ABOUT SECTION #############
      - label: "About Section"
        name: "about"
        widget: "object"
        fields:
        - { label: 'Heading', name: 'heading', widget: 'string' }
        - { label: 'Blurb', name: 'blurb', widget: 'richtext' }

      ############# SERVICES BULLETS #############
      - label: 'Services'
        name: 'services'
        widget: 'list'
        delete: true
        fields:
        - { label: 'Service', name: 'service', widget: 'string' }

      ############# ACCOMODATIONS BULLETS #############
      - label: 'Accomodations'
        name: 'accomodations'
        widget: 'list'
        delete: true
        fields:
        - { label: 'Accomodation', name: 'accom', widget: 'string' }

      ############# GALLERY SECTION #############
      - label: 'Gallery'
        name: 'gallery'
        widget: 'list'
        delete: true
        fields:
        - { label: 'Image', name: 'image', widget: 'image' }
    