backend:
  name: github
  repo: KimberleaH/nercopolisNails
  branch: main # Branch to update (optional; defaults to master)
  site_domain: https://nercopolisnails.pages.dev/
  base_url: https://nercopolisnails.pages.dev/
  auth_endpoint: /auth # This points to /functions/auth.js

media_folder: "/static/images" # Folder where user uploaded files should go
public_folder: "/images"


# The below needs to be updated...

collections:
  - name: 'home'
    label: 'Home'
    folder: 'content'
    slug: '{{slug}}'
    delete: false
    editor:
      preview: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description', name: 'description', widget: 'string' }

      ############# NAV LINKS #############
      - label: 'Nav Links'
        name: 'navLnks'
        widget: 'list'
        delete: true
        fields:
        - { label: 'Text', name: 'bookBtnTxt', widget: 'string' }
        - { label: 'Booking Button URL', name: 'bookBtnLnk', widget: 'string' }

      ############# BOOKING BUTTON #############
      - label: 'Booking Button'
        name: 'bookBtn'
        widget: 'object'
        hint: 'This affects the button in the nav and the header section.'
        fields:
        - { label: 'Text', name: 'bookBtnTxt', widget: 'string' }
        - { label: 'URL', name: 'bookBtnLnk', widget: 'string' }

      ############# HERO SECTION #############
      - { label: 'Main Heading', name: 'hero', widget: 'string' }
      - { label: 'Header Blurb', name: 'heroBlurb', widget: 'text' }
      - { label: 'Header Image', name: 'heroImg', widget: 'image' }
      - label: 'Gallery Button' ############# GALLERY BUTTON
        name: 'galleryBtn'
        widget: 'object'
        fields:
        - { label: 'Text', name: 'galleryBtnTxt', widget: 'string' }
        - { label: 'URL', name: 'galleryBtnLnk', widget: 'string' }

      ############# CONTACT SECTION #############
      - label: 'Contact Info'
        name: 'contactInfo'
        widget: 'object'
        fields:
        - label: 'Address'
          name: 'addressInf'
          widget: 'object'
          fields:
          - { label: 'Address', name: 'address', widget: 'string' }
          - { label: 'GMB URL', name: 'addressURL', widget: 'string' }
        - { label: 'Phone', name: 'phone', widget: 'string' }
        - { label: 'Email', name: 'email', widget: 'string' }
        - { label: 'Instagram', name: 'instagram', widget: 'string', hint: 'This appears below the gallery.' }
        - label: 'Business Hours' ############# HOURS
          name: 'busHours'
          widget: 'list'
          hint: 'Use <br> to create a gap.'
          delete: true
          fields:
          - { label: 'Days', name: 'days', widget: 'string' }
          - { label: 'Hours', name: 'hours', widget: 'string' }

      ############# ABOUT SECTION #############
      - { label: 'About Heading', name: 'about', widget: 'string' }
      - { label: 'About Blurb', name: 'aboutBlurb', widget: 'text' }
      - { label: 'Header Image', name: 'heroImg', widget: 'image' }

      ############# SERVICES BULLETS #############
      - label: 'Services'
        name: 'servicesList'
        widget: 'list'
        delete: true
        fields:
        - { label: 'Services', name: 'services', widget: 'string' }

      ############# ACCOMODATIONS BULLETS #############
      - label: 'Accomodations'
        name: 'accomList'
        widget: 'list'
        delete: true
        fields:
        - { label: 'Accomodations', name: 'accomodations', widget: 'string' }

      ############# GALLERY SECTION #############
      - label: 'Gallery'
        name: 'gallery'
        widget: 'list'
        delete: true
        fields:
        - { label: 'Image', name: 'image', widget: 'image' }
    